baseURL = 'https://blog.digne.no/'
title = 'Ludvig Digné'
theme = 'PaperMod'
locale = 'en-us'
dateFormat = '2 January 2006'

enableRobotsTXT = true
pygmentsUseClasses = true

[pagination]
pagerSize = 5

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[outputs]
home = ['HTML', 'RSS', 'JSON']   # JSON is needed only if you add a search page

[markup]
  [markup.highlight]
    noClasses = false

[params]
mainSections = ['posts']
author = 'Ludvig Digné'
description = 'Personal blog of Ludvig Digné'
keywords = ['Blog']
env = 'production'               # enables OpenGraph, Twitter cards, schema
DateFormat = '2 January 2006'    # PaperMod reads this one, not the top-level dateFormat
defaultTheme = 'auto'            # or 'dark' / 'light'

ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowShareButtons = false
ShowToc = true
TocOpen = false

[params.homeInfoParams]
Title = 'Tinkering with computer networking, radio, and possibly other things'
Content = 'I may write here occasionally -- mostly for personal reference.'

[[params.socialIcons]]
name = 'linkedin'
url = 'https://www.linkedin.com/in/ludvig-d-bbbba2b4/'

[[params.socialIcons]]
name = 'email'
url = 'mailto:ludvig@digne.se'

[[menus.main]]
identifier = 'posts'
name = 'Posts'
url = '/posts/'
weight = 1

# [[menus.main]]
# identifier = 'tags'
# name = 'Tags'
# url = '/tags/'
# weight = 2

[[menus.main]]
identifier = 'about'
name = 'About'
url = '/about/'
weight = 3
